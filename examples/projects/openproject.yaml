# Time logged in OpenProject. On OpenProject 17+ every time entry must be on a work package.
name: Acme Website
match:
  remotes: ["*gitlab.example.com*acme/website*"]
  paths: ["~/code/acme/website"]
meetings:
  recurring:
    - {name: DSM, start: "2026-11-02", weekdays: [mon, wed, fri], hours: 0.5}
  one_off: []
layout:                         # what the preview shows; OpenProject gets date, hours, work package, comment
  granularity: per_day
  columns:
    - {header: Work package, value: ask}          # Claude asks / looks it up (scripts/op.py work-packages)
    - {header: Date,         value: date, format: "YYYY-MM-DD"}
    - {header: Hours,        value: hours, format: number}
    - {header: Comment,      value: task}
destinations:
  - type: openproject
    url_env: OPENPROJECT_URL            # in secrets.env, e.g. https://openproject.example.com
    token_env: OPENPROJECT_TOKEN        # My account → Access tokens → API → + API token
    project: acme-website               # project identifier from its URL
    activity: Development               # optional (scripts/op.py activities)
    work_package: ask                   # ask | <id> | none (none only works on older versions)
